bind \\ split-window -h -c '#{pane_current_path}'
bind  - split-window -v -c '#{pane_current_path}'

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux config"
bind g display-popup -E -d '#{pane_current_path}' -w 90% -h 90% lazygit

set-option -g status-interval 5
set-option -g renumber-windows on
set-window-option -g window-status-format '#I:#($HOME/.local/bin/tmux-pane-label "#{pane_current_path}")'
set-window-option -g window-status-current-format '#I:#($HOME/.local/bin/tmux-pane-label "#{pane_current_path}")'

set-option -g mouse on
set -g extended-keys on
set -g extended-keys-format csi-u

# Keep terminal colours with tmux 3.8+, and preserve popup transparency.
set-option -sq theme terminal
set-window-option -g popup-style 'bg=default,fg=default'
set-window-option -g popup-border-style 'bg=default,fg=default'

set-window-option -g mode-keys vi
